server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Angular does the routing itself, so if nginx does not find the file
        # it must give index.html and not a 404 page.
        # Without this line the page /tasks gives 404 after a refresh.
        try_files $uri $uri/ /index.html;
    }
}
