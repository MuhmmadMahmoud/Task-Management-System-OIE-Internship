spring.application.name=taskmanager
server.port=8080

# ===== database =====
# the values after ":" are the default ones, docker-compose sends other values
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskdb}
spring.datasource.username=${DB_USERNAME:mo}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# update means Hibernate creates and updates the tables alone
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===== JWT =====
# the secret must be long, HS256 needs at least 32 characters
jwt.secret=${JWT_SECRET:ThisIsMySecretKeyForTheTaskManagerMiniProject2026}
# 24 hours in milliseconds
jwt.expiration=86400000
